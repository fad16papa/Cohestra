name: CI

on:
  push:
    branches:
      - main
      - release/uat
  pull_request:
    branches:
      - main
      - release/uat
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Cohestra.sln

      - name: Build
        run: dotnet build Cohestra.sln --no-restore -c Release

      - name: Test
        run: dotnet test Cohestra.sln --no-build -c Release --filter "Category!=Integration" --verbosity normal

      - name: SendGrid sandbox gate
        run: dotnet test src/Infrastructure.Tests/Infrastructure.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~SendGridSettingsValidatorTests" --verbosity normal

      - name: TenantIsolation unit gate (SM-1)
        run: |
          set -euo pipefail
          LIST_FILE=$(mktemp)
          RUN_FILE=$(mktemp)
          dotnet test src/Infrastructure.Tests/Infrastructure.Tests.csproj --no-build -c Release \
            --list-tests --filter "Category=TenantIsolation" | tee "$LIST_FILE"
          if grep -q 'No test matches the given testcase filter' "$LIST_FILE"; then
            echo "SM-1 gate failed: Category=TenantIsolation matched zero unit tests."
            exit 1
          fi
          TEST_COUNT=$(grep -cE '^\s+Cohestra\.' "$LIST_FILE" || true)
          if [ "$TEST_COUNT" -lt 1 ]; then
            echo "SM-1 gate failed: no TenantIsolation unit tests listed (count=$TEST_COUNT)."
            exit 1
          fi
          dotnet test src/Infrastructure.Tests/Infrastructure.Tests.csproj --no-build -c Release \
            --filter "Category=TenantIsolation" --verbosity normal 2>&1 | tee "$RUN_FILE"
          if grep -qE 'Skipped:\s+[1-9]' "$RUN_FILE"; then
            echo "SM-1 gate failed: TenantIsolation unit tests were skipped (deps unavailable)."
            exit 1
          fi
          if ! grep -qE 'Passed:\s+[1-9]' "$RUN_FILE"; then
            echo "SM-1 gate failed: zero TenantIsolation unit tests passed."
            exit 1
          fi

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    env:
      CI: true
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=cohestra_test;Username=crm;Password=crm
      ConnectionStrings__Redis: localhost:6379
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cohestra_test
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d cohestra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Cohestra.sln

      - name: Build
        run: dotnet build Cohestra.sln --no-restore -c Release

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Disposable backup restore rehearsal
        run: bash deploy/disposable-backup-restore.test.sh

      - name: Integration tests
        run: dotnet test src/Api.IntegrationTests/Api.IntegrationTests.csproj --no-build -c Release --filter "Category=Integration" --verbosity normal

      - name: Reset test database for TenantIsolation gate
        run: |
          set -euo pipefail
          CONTAINER=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "Postgres service container not found"
            docker ps
            exit 1
          fi
          docker exec -e PGPASSWORD=crm "$CONTAINER" psql -U crm -d postgres -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'cohestra_test' AND pid <> pg_backend_pid();"
          docker exec -e PGPASSWORD=crm "$CONTAINER" psql -U crm -d postgres -v ON_ERROR_STOP=1 -c \
            "DROP DATABASE IF EXISTS cohestra_test;"
          docker exec -e PGPASSWORD=crm "$CONTAINER" psql -U crm -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE cohestra_test OWNER crm;"

      - name: TenantIsolation API gate (SM-1)
        run: |
          set -euo pipefail
          LIST_FILE=$(mktemp)
          RUN_FILE=$(mktemp)
          dotnet test src/Api.IntegrationTests/Api.IntegrationTests.csproj --no-build -c Release \
            --list-tests --filter "Category=TenantIsolation" | tee "$LIST_FILE"
          if grep -q 'No test matches the given testcase filter' "$LIST_FILE"; then
            echo "SM-1 gate failed: Category=TenantIsolation matched zero API tests."
            exit 1
          fi
          TEST_COUNT=$(grep -cE '^\s+Cohestra\.' "$LIST_FILE" || true)
          if [ "$TEST_COUNT" -lt 1 ]; then
            echo "SM-1 gate failed: no TenantIsolation API tests listed (count=$TEST_COUNT)."
            exit 1
          fi
          dotnet test src/Api.IntegrationTests/Api.IntegrationTests.csproj --no-build -c Release \
            --filter "Category=TenantIsolation" --verbosity normal 2>&1 | tee "$RUN_FILE"
          if grep -qE 'Skipped:\s+[1-9]' "$RUN_FILE"; then
            echo "SM-1 gate failed: TenantIsolation API tests were skipped (deps unavailable)."
            exit 1
          fi
          if ! grep -qE 'Passed:\s+[1-9]' "$RUN_FILE"; then
            echo "SM-1 gate failed: zero TenantIsolation API tests passed."
            exit 1
          fi

  web:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  exact-sha-scan:
    name: Exact-SHA security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan the exact checked-out SHA
        env:
          SCAN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCAN_SHA"
          bash deploy/exact-sha-secret-scan.sh

  gitguardian-exact-sha-api:
    name: GitGuardian exact-SHA API scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/uat')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned ggshield
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check 'ggshield==1.56.1'

      - name: Scan the exact main SHA via GitGuardian API
        env:
          SCAN_SHA: ${{ github.sha }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GGSHIELD_BIN: ggshield
        run: |
          set -euo pipefail
          set +x
          export PATH="${HOME}/.local/bin:${PATH}"
          test "$(git rev-parse HEAD)" = "$SCAN_SHA"
          bash deploy/exact-sha-gitguardian-api-scan.sh

  uat-isolation:
    name: UAT isolation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact-SHA secret scan contract
        run: bash deploy/exact-sha-secret-scan.test.sh

      - name: Exact-SHA GitGuardian API scan contract
        run: bash deploy/exact-sha-gitguardian-api-scan.test.sh

      - name: Validate isolated UAT compose
        run: bash deploy/validate-uat-isolation.sh

      - name: Validate UAT deploy workflow contract
        run: bash deploy/validate-deploy-uat-workflow.sh

      - name: UAT predeploy gate contract
        run: bash deploy/validate-uat-predeploy-gate.test.sh

      - name: UAT gate activation contract
        run: bash deploy/validate-uat-gate-activation.test.sh

      - name: UAT HOLD commissioning contract
        run: bash deploy/commission-uat-hold.test.sh

      - name: UAT delivery status contract
        run: bash deploy/uat-delivery-status.test.sh

      - name: UAT final outcome contract
        run: bash deploy/uat-final-outcome.test.sh

      - name: UAT rollback contract
        run: |
          bash deploy/uat-rollback.test.sh
          bash deploy/uat-host-mutation-lock.test.sh
          bash deploy/validate-uat-rollback-workflow.sh

      - name: UAT origin/main fetch helper contract
        run: bash deploy/fetch-origin-main.test.sh

      - name: UAT origin/release/uat fetch contract
        run: bash deploy/fetch-origin-uat.test.sh

      - name: PR-D AD-23 protected-push contract
        run: |
          set -euo pipefail
          bash deploy/validate-prd-ad23.test.sh
          bash deploy/validate-ad25-sync-procedure.sh
          bash deploy/validate-ad25-sync-fixture.test.sh
          bash deploy/write-uat-deploy-provenance.test.sh

      - name: Inline suppression and merge-token contracts
        run: |
          set -euo pipefail
          bash deploy/validate-inline-suppression.test.sh
          python3 deploy/simulate-merge-token-trigger.py

      - name: UAT SSH step evidence contract
        run: bash deploy/record-uat-ssh-execution.test.sh

      - name: Persist CI_CONTRACT commissioning evidence
        env:
          UAT_GATE_EVIDENCE_DIR: artifacts/ci-contract
        run: |
          set -euo pipefail
          bash deploy/commission-uat-hold.sh
          test -f artifacts/ci-contract/uat-hold-commissioning.json
          python3 -c 'import json; p=json.load(open("artifacts/ci-contract/uat-hold-commissioning.json")); assert p.get("evidence_class")=="CI_CONTRACT"; assert p.get("live_deploy_uat_hold") is False'
          for ev in artifacts/ci-contract/*.json; do
            if grep -qE 'BEGIN (OPENSSH |RSA )?PRIVATE KEY|-----BEGIN|Bearer |password' "$ev"; then
              rm -f "$ev"
              echo "REFUSE: removed secret-like ${ev}"
              exit 1
            fi
          done

      - name: Upload CI_CONTRACT commissioning artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uat-ci-contract-commissioning
          path: artifacts/ci-contract/
          if-no-files-found: error

      - name: Fail-closed UAT secret contract
        run: bash deploy/fail-closed-uat-secrets.test.sh

      - name: Accepted-SHA reset contract
        run: bash deploy/reset-accepted-sha.test.sh

      - name: UAT acceptance probe contract
        run: bash deploy/uat-acceptance.test.sh

      - name: Public UAT smoke contract
        run: bash deploy/public-uat-smoke.test.sh

      - name: Fetch UAT acceptance fail-closed contract
        run: bash deploy/fetch-uat-acceptance.test.sh

      - name: UAT Playwright harness contract
        run: bash deploy/validate-uat-playwright.sh

      - name: UAT acceptance summary contract
        run: bash deploy/uat-acceptance-summary.test.sh

      - name: UAT OTP mailbox contract
        run: bash deploy/uat-otp-mailbox.test.sh

      - name: UAT recaptcha dual-layer contract
        run: bash deploy/validate-uat-recaptcha.sh

      - name: UAT Story 19.5 lifecycle contract
        run: bash deploy/validate-uat-lifecycle.sh

      - name: Autonomous delivery loop contract
        run: bash deploy/validate-autonomous-loop.sh

      - name: Production compose contract
        run: bash deploy/validate-production-compose.sh

      - name: Production runtime secrets isolation
        run: |
          git fetch --no-tags --depth=1 origin main
          bash deploy/validate-production-runtime-secrets.test.sh

      - name: Production CSP contract
        run: bash deploy/validate-production-csp.sh

      - name: Tenant-filter bypass allowlist
        run: bash deploy/validate-tenant-filter-bypass-allowlist.sh

      - name: Production secret inventory contract
        run: bash deploy/validate-production-secret-inventory.sh

      - name: Production host UFW fail-closed contract
        run: bash deploy/harden-production-host.test.sh

      - name: Production host contract
        run: bash deploy/validate-production-host.sh

      - name: Production deploy workflow contract
        run: bash deploy/validate-deploy-production-workflow.sh

      - name: Fail-closed Production secret contract
        run: bash deploy/fail-closed-production-secrets.test.sh

      - name: Production SHA reset contract
        run: bash deploy/reset-production-sha.test.sh

      - name: Production target contract
        run: bash deploy/validate-production-target.test.sh

      - name: Production provenance contract
        run: bash deploy/validate-production-provenance.test.sh

      - name: Production remote dry-run contract
        run: bash deploy/production-remote-deploy.test.sh

      - name: Production rollback contract
        run: bash deploy/production-rollback.test.sh

      - name: Production accepted-SHA ledger contract
        run: bash deploy/record-production-accepted-sha.test.sh

      - name: Production evidence schema contract
        run: bash deploy/validate-production-evidence-schema.test.sh

      - name: Production overlay target contract
        run: bash deploy/validate-production-overlay-target.test.sh

      - name: Production overlay connectivity contract
        run: bash deploy/verify-production-overlay-connectivity.test.sh

      - name: Production overlay bootstrap contract
        run: bash deploy/bootstrap-production-overlay.test.sh

      - name: Production checkout bootstrap contract
        run: bash deploy/bootstrap-production-checkout.test.sh

      - name: Production Docker bootstrap contract
        run: bash deploy/bootstrap-production-docker.test.sh

      - name: Production compose config-only placeholder contract
        run: bash deploy/production-compose-config-placeholders.test.sh

      - name: Production Tailscale Grants contract
        run: bash deploy/validate-tailscale-production-grants.sh

      - name: Production OIDC inspection contract
        run: bash deploy/validate-inspect-production-oidc-workflow.sh

  smoke-docker:
    name: Docker stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run Docker smoke
        run: bash deploy/ci-docker-smoke.sh
