name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        required: true
        type: choice
        options:
          - deploy
          - rollback
      deploy_sha:
        description: 40-character hexadecimal SHA
        required: true
        type: string
      restore_dump:
        description: forbidden in 46.3
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  validate-sha:
    name: Validate SHA provenance
    runs-on: ubuntu-latest
    outputs:
      validated_sha: ${{ steps.prove.outputs.validated_sha }}
      reviewed_pr_head: ${{ steps.prove.outputs.reviewed_pr_head }}
      associated_pr_number: ${{ steps.prove.outputs.associated_pr_number }}
    steps:
      - name: Refuse restore_dump
        if: ${{ inputs.restore_dump != '' }}
        run: |
          echo "NOT_IMPLEMENTED_46_5"
          echo "REFUSE: restore_dump is forbidden in Story 46.3"
          exit 1

      - name: Checkout main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Layer A and Layer B
        id: prove
        env:
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORIGIN_MAIN_REF: origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          bash deploy/validate-production-provenance.sh

  deploy:
    name: Deploy pinned SHA
    needs: validate-sha
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse SHA substitution
        env:
          INPUT_SHA: ${{ inputs.deploy_sha }}
          VALIDATED_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
        run: |
          set -euo pipefail
          if [[ "${INPUT_SHA,,}" != "${VALIDATED_SHA,,}" ]]; then
            echo "REFUSE: deploy_sha does not equal validated_sha"
            exit 1
          fi

      - name: Checkout validated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate-sha.outputs.validated_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-run provenance before SSH
        env:
          DEPLOY_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORIGIN_MAIN_REF: origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          bash deploy/validate-production-provenance.sh

      - name: Fail closed if Production secrets are missing
        env:
          PROD_DROPLET_HOST: ${{ secrets.PROD_DROPLET_HOST }}
          PROD_DROPLET_USER: ${{ secrets.PROD_DROPLET_USER }}
          PROD_DROPLET_SSH_KEY: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          PROD_PUBLIC_BASE_URL: ${{ secrets.PROD_PUBLIC_BASE_URL }}
        run: bash deploy/fail-closed-production-secrets.sh

      - name: Validate Production target
        env:
          PROD_DROPLET_HOST: ${{ secrets.PROD_DROPLET_HOST }}
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          PROD_PUBLIC_BASE_URL: ${{ secrets.PROD_PUBLIC_BASE_URL }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT }}
        run: bash deploy/validate-production-target.sh

      - name: Dry-run Production control plane over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
        with:
          host: 159.223.55.242
          username: ${{ secrets.PROD_DROPLET_USER }}
          key: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          port: 22
          command_timeout: 60m
          debug: false
          envs: PROD_DROPLET_DEPLOY_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            if [[ ! "${DEPLOY_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "REFUSE: Production deploy requires a 40-character DEPLOY_SHA"
              exit 1
            fi
            DEPLOY_PATH="${PROD_DROPLET_DEPLOY_PATH:-/home/deploy/cohestra-production}"
            cd "$DEPLOY_PATH"
            git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main
            DEPLOY_SHA="${DEPLOY_SHA,,}" DEPLOY_BRANCH=main bash deploy/reset-production-sha.sh
            bash deploy/production-remote-deploy.sh

  rollback:
    name: Rollback pinned SHA
    needs: validate-sha
    if: ${{ inputs.action == 'rollback' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse SHA substitution
        env:
          INPUT_SHA: ${{ inputs.deploy_sha }}
          VALIDATED_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
        run: |
          set -euo pipefail
          if [[ "${INPUT_SHA,,}" != "${VALIDATED_SHA,,}" ]]; then
            echo "REFUSE: deploy_sha does not equal validated_sha"
            exit 1
          fi

      - name: Checkout validated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate-sha.outputs.validated_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-run provenance before SSH
        env:
          DEPLOY_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ORIGIN_MAIN_REF: origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          bash deploy/validate-production-provenance.sh

      - name: Fail closed if Production secrets are missing
        env:
          PROD_DROPLET_HOST: ${{ secrets.PROD_DROPLET_HOST }}
          PROD_DROPLET_USER: ${{ secrets.PROD_DROPLET_USER }}
          PROD_DROPLET_SSH_KEY: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          PROD_PUBLIC_BASE_URL: ${{ secrets.PROD_PUBLIC_BASE_URL }}
        run: bash deploy/fail-closed-production-secrets.sh

      - name: Validate Production target
        env:
          PROD_DROPLET_HOST: ${{ secrets.PROD_DROPLET_HOST }}
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          PROD_PUBLIC_BASE_URL: ${{ secrets.PROD_PUBLIC_BASE_URL }}
          PROD_COMPOSE_PROJECT: ${{ vars.PROD_COMPOSE_PROJECT }}
        run: bash deploy/validate-production-target.sh

      - name: Dry-run Production rollback over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          PROD_DROPLET_DEPLOY_PATH: ${{ secrets.PROD_DROPLET_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.validate-sha.outputs.validated_sha }}
        with:
          host: 159.223.55.242
          username: ${{ secrets.PROD_DROPLET_USER }}
          key: ${{ secrets.PROD_DROPLET_SSH_KEY }}
          port: 22
          command_timeout: 60m
          debug: false
          envs: PROD_DROPLET_DEPLOY_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            DEPLOY_PATH="${PROD_DROPLET_DEPLOY_PATH:-/home/deploy/cohestra-production}"
            cd "$DEPLOY_PATH"
            git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main || git fetch origin main
            ROLLBACK_SHA="${DEPLOY_SHA,,}" bash deploy/production-rollback.sh
