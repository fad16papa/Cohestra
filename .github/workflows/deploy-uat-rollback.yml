name: UAT rollback

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Previous 40-character hexadecimal SHA that is an ancestor of origin/main
        required: true
        type: string
      confirm:
        description: "Type exactly: UAT ROLLBACK: AUTHORIZED"
        required: true
        type: string
      execute:
        description: Mutate the UAT host (default dry-run)
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-uat-rollback
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    name: Validate UAT rollback request
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      rollback_sha: ${{ steps.gate.outputs.rollback_sha }}
    steps:
      - name: Require refs/heads/main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "REFUSE: UAT rollback must be dispatched from main"
            exit 1
          fi

      - name: Checkout dispatch SHA on main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Dry-run previous-SHA recovery
        id: gate
        env:
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          UAT_ROLLBACK_AUTHORIZED: true
          UAT_ROLLBACK_CONFIRM: ${{ inputs.confirm }}
          UAT_ROLLBACK_EXECUTE: "false"
          ORIGIN_MAIN_REF: origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash deploy/uat-rollback.sh
          echo "rollback_sha=${ROLLBACK_SHA,,}" >>"$GITHUB_OUTPUT"

  rollback:
    name: Execute UAT host rollback
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute && inputs.confirm == 'UAT ROLLBACK: AUTHORIZED' }}
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout dispatch SHA for runner helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed if UAT secrets are missing
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
        run: bash deploy/fail-closed-uat-secrets.sh

      - name: Rollback previous SHA over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
          ROLLBACK_SHA: ${{ needs.validate.outputs.rollback_sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          command_timeout: 60m
          envs: DROPLET_DEPLOY_PATH,ROLLBACK_SHA
          script: |
            set -euo pipefail
            if [[ ! "${ROLLBACK_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "REFUSE: ROLLBACK_SHA must be a 40-character hexadecimal Git SHA"
              exit 1
            fi
            ROLLBACK_SHA="${ROLLBACK_SHA,,}"
            DEPLOY_PATH="${DROPLET_DEPLOY_PATH:-/home/deploy/cohestra}"
            cd "$DEPLOY_PATH"
            export GIT_TERMINAL_PROMPT=0
            fetch_ok=0
            for attempt in 1 2 3 4 5 6; do
              if git fetch origin main; then
                fetch_ok=1
                break
              fi
              echo "WARN: git fetch origin/main attempt ${attempt} failed"
              sleep 20
            done
            if [[ "$fetch_ok" != 1 ]]; then
              echo "REFUSE: git fetch origin/main failed after retries"
              exit 1
            fi
            TIP_SHA="$(git rev-parse --verify origin/main)"
            TIP_SHA="${TIP_SHA,,}"
            if [[ "$ROLLBACK_SHA" == "$TIP_SHA" ]]; then
              echo "REFUSE: current origin/main tip must use Deploy UAT, not rollback"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$ROLLBACK_SHA" origin/main; then
              echo "REFUSE: ROLLBACK_SHA is not an ancestor of origin/main"
              exit 1
            fi
            git reset --hard "$ROLLBACK_SHA"
            ACTUAL="$(git rev-parse HEAD)"
            if [[ "${ACTUAL,,}" != "$ROLLBACK_SHA" ]]; then
              echo "REFUSE: DEPLOYED_SHA does not match ROLLBACK_SHA"
              exit 1
            fi
            echo "EXPECTED_SHA=${ROLLBACK_SHA}"
            echo "DEPLOYED_SHA=${ACTUAL,,}"
            if [[ ! -f deploy/uat-compose.sh ]]; then
              echo "REFUSE: isolated UAT compose helper is missing on this SHA"
              exit 1
            fi
            bash deploy/uat-compose.sh build api
            bash deploy/uat-compose.sh build web
            bash deploy/uat-compose.sh up -d --no-build
            echo "DATABASE_MUTATED=false"
