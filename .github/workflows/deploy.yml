name: Deploy UAT

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy accepted SHA to UAT
    runs-on: ubuntu-latest
    environment: uat
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout accepted SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Fail closed if UAT secrets are missing
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
        run: bash deploy/fail-closed-uat-secrets.sh

      - name: Record deploy dispatch evidence
        run: bash deploy/record-uat-deploy-dispatch.sh

      - name: Deploy over SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        env:
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
          DEPLOY_SHA: ${{ env.TARGET_SHA }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: DROPLET_DEPLOY_PATH,DEPLOY_SHA
          script: |
            set -euo pipefail
            if [[ -z "${DEPLOY_SHA:-}" ]]; then
              echo "REFUSE: autonomous UAT deploy requires DEPLOY_SHA"
              exit 1
            fi
            DEPLOY_PATH="${DROPLET_DEPLOY_PATH:-}"
            if [[ -z "$DEPLOY_PATH" ]]; then
              DEPLOY_PATH="$HOME/cohestra"
            fi
            cd "$DEPLOY_PATH"
            bash deploy/remote-deploy.sh
            EXPECTED_SHA="${DEPLOY_SHA}"
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            echo "EXPECTED_SHA=${EXPECTED_SHA}"
            echo "DEPLOYED_SHA=${DEPLOYED_SHA}"
            if [[ "$EXPECTED_SHA" != "$DEPLOYED_SHA" ]]; then
              echo "REFUSE: EXPECTED_SHA != DEPLOYED_SHA"
              exit 1
            fi

      - name: Fetch host acceptance JSON
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_DEPLOY_PATH: ${{ secrets.DROPLET_DEPLOY_PATH }}
        run: bash deploy/fetch-uat-acceptance.sh

      - name: Public UAT smoke
        env:
          UAT_PUBLIC_BASE_URL: ${{ secrets.UAT_PUBLIC_BASE_URL }}
        run: |
          if [[ -z "${UAT_PUBLIC_BASE_URL:-}" ]]; then
            UAT_PUBLIC_BASE_URL=https://uat.cohestra.app
          fi
          export UAT_PUBLIC_BASE_URL
          bash deploy/public-uat-smoke.sh

      - name: Upload UAT evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uat-deploy-evidence
          path: |
            artifacts/uat-deploy-dispatch.json
            artifacts/uat-acceptance.json
            artifacts/uat-public-smoke.json
          if-no-files-found: warn
