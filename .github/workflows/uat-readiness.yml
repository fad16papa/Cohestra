name: UAT Readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches:
      - main
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  check_suite:
    types: [completed]
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Read-only diagnostic PR number
        required: false
      sha:
        description: Read-only diagnostic SHA
        required: false
  push:
    branches:
      - main

concurrency:
  group: uat-readiness-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  evaluate:
    name: Evaluate UAT readiness
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event_name != 'check_suite' || github.event.check_suite.app.slug == 'gitguardian' || github.event.check_suite.app.slug == 'github-actions') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name == 'CI')
    runs-on: ubuntu-latest
    outputs:
      should_notify: ${{ steps.report.outputs.should_notify }}
      state: ${{ steps.report.outputs.state }}
      pr_number: ${{ steps.report.outputs.pr_number }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Checkout event SHA with persist-credentials false
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Refuse privileged execution
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request_target" ]]; then
            echo "REFUSE: pull_request_target is forbidden"
            exit 1
          fi
          if [[ "${GITHUB_WORKFLOW}" == "UAT Readiness" && "${GITHUB_EVENT_NAME}" == "workflow_run" && "${{ github.event.workflow_run.name }}" == "UAT Readiness" ]]; then
            echo "REFUSE: self-trigger recursion"
            exit 1
          fi

      - name: Evaluate exact-SHA readiness
        id: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UAT_READINESS_OUT_DIR: artifacts
          UAT_READINESS_PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || inputs.pr_number }}
          UAT_READINESS_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.sha }}
          UAT_READINESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          UAT_READINESS_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          UAT_DEPLOY_GATE_ACTIVE: ${{ vars.UAT_DEPLOY_GATE_ACTIVE }}
        run: |
          set -euo pipefail
          env -u COHESTRA_GH_API_MOCK bash deploy/evaluate-uat-readiness.sh
          python3 - artifacts/uat-readiness.json <<'PY'
          import json, pathlib
          report = json.load(open("artifacts/uat-readiness.json", encoding="utf-8"))
          assert report.get("owner_authorization_claimed") is False
          print(f"state={report.get('state')}")
          PY

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uat-readiness-evidence
          path: |
            artifacts/uat-readiness.json
            artifacts/uat-readiness.md
            artifacts/uat-readiness-notice.json
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f artifacts/uat-readiness.md ]]; then
            cat artifacts/uat-readiness.md >>"$GITHUB_STEP_SUMMARY"
          fi

  notify:
    name: Notify Product Owner on decision or material blocker
    needs: evaluate
    if: needs.evaluate.outputs.should_notify == 'true' && needs.evaluate.outputs.pr_number != '' && github.event_name != 'pull_request' && github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Download sanitized notice
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: uat-readiness-evidence
          path: artifacts

      - name: Post idempotent nonsecret notice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          notice = json.load(open("artifacts/uat-readiness-notice.json", encoding="utf-8"))
          if notice.get("should_notify") is not True:
              raise SystemExit(0)
          body = notice.get("body") or ""
          if not body or "BEGIN " in body or "Bearer " in body or "ghp_" in body or "ghs_" in body or "github_pat_" in body:
              raise SystemExit("REFUSE: notice body missing or secret-like")
          if notice.get("owner_authorization_claimed") is True:
              raise SystemExit("REFUSE: notice claims authorization")
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              if resp.status not in {200, 201}:
                  raise SystemExit(f"REFUSE: notice HTTP {resp.status}")
          print("NOTICE_POSTED=1")
          PY
