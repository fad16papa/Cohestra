name: Inspect Production OIDC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Decode GitHub OIDC claims
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Request and decode OIDC payload only
        env:
          OIDC_INSPECT_AUDIENCE: cohestra-production-oidc-inspect
        run: |
          set -euo pipefail
          # ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN must
          # be read in-process to acquire the GitHub OIDC JWT. Do not echo,
          # print, upload, persist, or export them. Do not print the raw JWT.
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          claims = (
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "environment",
              "job_workflow_ref",
              "workflow_ref",
              "workflow",
              "event_name",
              "ref_type",
              "runner_environment",
              "actor",
              "sha",
          )

          def refuse(reason: str) -> None:
              print("RESULT=REFUSE")
              print(f"REFUSE_REASON={reason}")
              print("JWT_PRINTED=false")
              print("SIGNATURE_PRINTED=false")
              print("REQUEST_TOKEN_PRINTED=false")
              raise SystemExit(1)

          request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "").strip()
          request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "").strip()
          audience = os.environ.get("OIDC_INSPECT_AUDIENCE", "").strip()
          if not request_url:
              refuse("oidc_request_url_missing")
          if not request_token:
              refuse("oidc_request_token_missing")
          if not audience or audience.lower() in {"tailscale", "https://tailscale.com"}:
              refuse("inspect_audience_invalid")
          if "tailscale" in audience.lower():
              refuse("inspect_audience_must_not_target_tailscale")

          separator = "&" if "?" in request_url else "?"
          url = f"{request_url}{separator}audience={urllib.parse.quote(audience)}"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {request_token}",
                  "Accept": "application/json; api-version=2.0",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
          except urllib.error.URLError:
              refuse("oidc_request_failed")

          try:
              payload = json.loads(body.decode("utf-8"))
              jwt = payload["value"]
          except (json.JSONDecodeError, KeyError, TypeError, UnicodeDecodeError):
              refuse("oidc_response_malformed")

          if not isinstance(jwt, str) or jwt.count(".") != 2:
              refuse("oidc_jwt_malformed")

          try:
              encoded_payload = jwt.split(".", 2)[1]
              padded = encoded_payload + ("=" * (-len(encoded_payload) % 4))
              decoded = json.loads(base64.urlsafe_b64decode(padded.encode("ascii")))
          except (ValueError, json.JSONDecodeError, UnicodeDecodeError):
              refuse("oidc_payload_undecodable")

          if not isinstance(decoded, dict):
              refuse("oidc_payload_not_object")

          print("RESULT=PASS")
          print("JWT_PRINTED=false")
          print("SIGNATURE_PRINTED=false")
          print("REQUEST_TOKEN_PRINTED=false")
          print("EXTERNAL_AUTH_EXCHANGE=false")
          print(f"INSPECT_AUDIENCE={audience}")
          known = set(claims)
          for name in claims:
              value = decoded.get(name)
              if value is None or value == "":
                  print(f"{name}=ABSENT")
              else:
                  print(f"{name}={value}")
          for name in sorted(decoded):
              if name not in known:
                  print(f"OTHER_CLAIM={name}")
          PY
