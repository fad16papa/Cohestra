# Launch-hardening overlay — local overlay only. NOT Production topology.
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Canonical Production compose is docker-compose.production.yml
# (project cohestra-production, dedicated droplet). Never treat this overlay
# as Production. Never run it on the UAT / lead-generation-crm host as Production.
#
# Enables reCAPTCHA on signup and disables demo/load seeds.
# Keeps Development environment so local Docker credentials still work.
#
# See docs/deploy/production-launch-program.md
# PRODUCTION=NO-GO until the owner writes PRODUCTION CUTOVER: AUTHORIZED.

services:
  api:
    environment:
      DemoDataSeed__Enabled: "false"
      LoadTestSeed__Enabled: "false"
      SelfServeSignup__Recaptcha__Enabled: ${SelfServeSignup__Recaptcha__Enabled:-true}
      FollowUpDigest__Enabled: ${FollowUpDigest__Enabled:-false}

  web:
    build:
      args:
        NEXT_PUBLIC_RECAPTCHA_ENABLED: ${NEXT_PUBLIC_RECAPTCHA_ENABLED:-true}
