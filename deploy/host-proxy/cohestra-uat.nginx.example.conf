# EXAMPLE ONLY — do not replace the existing application's server block.
# Add a new server_name for Cohestra UAT. Leave every existing hostname unchanged.
#
# TLS stays on this host proxy. Upstream Cohestra nginx is HTTP on loopback.

# server {
#     listen 80;
#     listen [::]:80;
#     server_name uat.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uat.example.com;   # replace with the Cohestra UAT hostname

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
