# EXAMPLE ONLY — add a NEW server_name. Do not replace existing server blocks.
#
# Filename: zz-cohestra-uat.conf so this does NOT become the HTTP default_server.
# Upstream is Docker DNS on cohestra_uat_edge. Variable proxy_pass so nginx
# re-resolves after Cohestra recreate (static proxy_pass caches the first IP).
#
# Do not proxy to host loopback from this container — that is itself, not Cohestra.

server {
    listen 80;
    listen [::]:80;
    server_name uat.example.com *.uat.example.com;   # platform + tenant namespace — never the existing site

    # Discriminator: Host-header proof must see this. Existing default_server will not.
    add_header X-Cohestra-Edge-Vhost "uat" always;

    client_max_body_size 10m;

    # Docker embedded DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP-01 on this Host (Story 19.2). Webroot is the EXISTING edge volume
    # /var/www/certbot — not cohestra_uat_certbot_www.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $cohestra_edge http://cohestra-uat-nginx:80;
        proxy_pass $cohestra_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
