# EXAMPLE ONLY — add a NEW server_name. Do not replace existing server blocks.
#
# Upstream is Docker DNS on cohestra_uat_edge, NOT host loopback.
# Inside lead-generation-crm-nginx-1, 127.0.0.1 is this container itself.

# Story 19.1 — HTTP proof (optional). Story 19.2 owns Cohestra HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name uat.example.com;   # Cohestra UAT hostname only

    client_max_body_size 10m;

    location / {
        proxy_pass http://cohestra-uat-nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

