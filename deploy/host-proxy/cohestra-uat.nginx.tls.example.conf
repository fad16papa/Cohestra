# EXAMPLE ONLY — additive HTTP + HTTPS for the Cohestra UAT hostname.
# Filename: zz-cohestra-uat.conf. Does NOT replace active-ssl.conf.
# TLS terminates on lead-generation-crm-nginx-1. Upstream stays
# http://cohestra-uat-nginx:80 (Docker DNS). Never the host-loopback diagnostic port.
#
# Cert path is the UAT hostname only — never the existing public site.

server {
    listen 80;
    listen [::]:80;
    server_name uat.example.com *.uat.example.com;

    add_header X-Cohestra-Edge-Vhost "uat" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uat.example.com *.uat.example.com;

    add_header X-Cohestra-Edge-Vhost "uat" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate /etc/letsencrypt/live/uat.cohestra.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.cohestra.app/privkey.pem;

    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $cohestra_edge http://cohestra-uat-nginx:80;
        proxy_pass $cohestra_edge;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
